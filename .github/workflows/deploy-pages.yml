name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      allow_large_catalog_change:
        description: Publish a reviewed large inventory reduction and record the guard override
        required: false
        type: boolean
        default: false
  schedule:
    - cron: '17 11 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    outputs:
      inventory_sha256: ${{ steps.release.outputs.inventory_sha256 }}
    steps:
      - name: Check out the public repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Use Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false

      - name: Stage the public allowlist
        run: node _build-tools/stage-public-build.mjs

      - name: Refresh Shopify catalog against the current public release
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.allow_large_catalog_change != true }}
        run: >-
          node .build/scripts/sync-catalog.mjs
          --baseline-url https://cmcnosky.github.io/kiss-it-goodbuy-preview/inventory.json

      - name: Refresh a reviewed large catalog change
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.allow_large_catalog_change == true }}
        run: >-
          node .build/scripts/sync-catalog.mjs
          --baseline-url https://cmcnosky.github.io/kiss-it-goodbuy-preview/inventory.json
          --allow-large-change

      - name: Review lighting of new or replaced catalog photographs
        run: |
          if ! /usr/bin/python3 -c 'from PIL import Image, ImageCms; import numpy' >/dev/null 2>&1; then
            sudo apt-get -qq update
            sudo apt-get -qq install python3-numpy python3-pil
          fi
          /usr/bin/python3 _build-tools/profile-photographs.py --inventory .build/dist/inventory.json --output .build/dist/photo-tones.js

      - name: Identify this set of versioned merchant photographs
        id: photo-set
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const crypto = require('node:crypto');
          const { products } = JSON.parse(fs.readFileSync('.build/dist/inventory.json', 'utf8'));
          const sources = [...new Set(products.flatMap(product => product.images.map(image => image.src)))].sort();
          const digest = crypto.createHash('sha256').update(JSON.stringify(sources)).digest('hex');
          fs.appendFileSync(process.env.GITHUB_OUTPUT, 'digest=' + digest + '\n');
          NODE

      - name: Reuse photograph processing cache
        uses: actions/cache@v4
        with:
          path: .build/photo-cache
          key: catalog-clarity-${{ runner.os }}-${{ hashFiles('_build-tools/sharpen-catalog.py') }}-${{ hashFiles('_build-tools/photo-sources/catalog-masters.json') }}-${{ steps.photo-set.outputs.digest }}
          restore-keys: |
            catalog-clarity-${{ runner.os }}-${{ hashFiles('_build-tools/sharpen-catalog.py') }}-
            catalog-clarity-${{ runner.os }}-

      - name: Sharpen merchant originals at storefront sizes
        run: >-
          /usr/bin/python3 _build-tools/sharpen-catalog.py
          --inventory .build/dist/inventory.json
          --output-dir .build/dist/assets/catalog-clarity
          --manifest .build/dist/photo-sharpness.js
          --cache .build/photo-cache

      - name: Render static entry points and product pages
        run: node .build/scripts/render-pages.mjs --dist .build/dist

      - name: Validate the staged storefront
        run: |
          node --check .build/dist/app.js
          node --check .build/dist/photo-sharpness.js
          node --check .build/dist/photo-delivery.js
          node --check .build/dist/catalog-normalize.js
          node --check .build/dist/commerce.js
          node --check .build/dist/checkout-recovery.js
          node --check .build/dist/planner.js
          node --check .build/dist/studio-state.js
          node --check .build/dist/studio-runtime.js
          node --check .build/dist/studio.js
          node --check .build/dist/storefront-data.js
          node --check .build/scripts/check-live-release.mjs
          node .build/scripts/sync-catalog.mjs --self-test
          node .build/scripts/test-commerce.mjs
          node .build/scripts/test-storefront-data.mjs
          node .build/scripts/test-storefront.mjs
          node .build/scripts/test-interactions.mjs
          node .build/scripts/test-cross-tab.mjs
          node .build/scripts/test-palette.mjs
          node .build/scripts/test-photo-delivery.mjs
          node .build/scripts/check-catalog-clarity.mjs .build/dist
          node .build/scripts/test-planner.mjs
          node .build/scripts/test-checkout-recovery.mjs
          node .build/scripts/test-studio-state.mjs
          node .build/scripts/test-studio-runtime.mjs
          node .build/scripts/test-release-guards.mjs

      - name: Install the pinned browser test runtime
        run: npm ci --prefix deployment/browser-qa --ignore-scripts --no-audit --no-fund

      - name: Install Chromium for browser release checks
        timeout-minutes: 5
        run: npx --prefix deployment/browser-qa playwright install chromium

      - name: Check representative pages in a real browser
        run: npm test --prefix deployment/browser-qa

      - name: Preserve browser failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-release-failure
          path: deployment/browser-qa/test-results
          if-no-files-found: ignore
          retention-days: 7

      - name: Record the exact catalog in the release
        id: release
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const crypto = require('node:crypto');
          const bytes = fs.readFileSync('.build/dist/inventory.json');
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `inventory_sha256=${crypto.createHash('sha256').update(bytes).digest('hex')}\n`);
          NODE

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload the verified Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: .build/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    needs: build
    steps:
      - name: Check out the public repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Use Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify the published release anonymously
        run: >-
          node _build-tools/check-live-release.mjs
          --base-url "${{ steps.deployment.outputs.page_url }}"
          --expected-inventory-sha256 "${{ needs.build.outputs.inventory_sha256 }}"
