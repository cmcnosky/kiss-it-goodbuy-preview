<svg xmlns="http://www.w3.org/2000/svg" width="0" height="0" aria-hidden="true" focusable="false" style="position:absolute;pointer-events:none">
  <!-- Monotonic tonal curves with fixed black and white endpoints preserve recorded highlights and shadows. -->
  <defs>
    <filter id="kigb-photo-shadow" color-interpolation-filters="sRGB" x="0" y="0" width="100%" height="100%">
      <feComponentTransfer>
        <feFuncR type="gamma" exponent=".80"/><feFuncG type="gamma" exponent=".80"/><feFuncB type="gamma" exponent=".80"/>
      </feComponentTransfer>
    </filter>
    <filter id="kigb-photo-midtones" color-interpolation-filters="sRGB" x="0" y="0" width="100%" height="100%">
      <feComponentTransfer>
        <feFuncR type="gamma" exponent=".90"/><feFuncG type="gamma" exponent=".90"/><feFuncB type="gamma" exponent=".90"/>
      </feComponentTransfer>
    </filter>
    <filter id="kigb-photo-highlights" color-interpolation-filters="sRGB" x="0" y="0" width="100%" height="100%">
      <feComponentTransfer>
        <feFuncR type="gamma" exponent="1.10"/><feFuncG type="gamma" exponent="1.10"/><feFuncB type="gamma" exponent="1.10"/>
      </feComponentTransfer>
    </filter>
    <filter id="kigb-photo-contrast" color-interpolation-filters="sRGB" x="0" y="0" width="100%" height="100%">
      <feComponentTransfer>
        <feFuncR type="table" tableValues="0 .10 .22 .36 .50 .64 .78 .90 1"/>
        <feFuncG type="table" tableValues="0 .10 .22 .36 .50 .64 .78 .90 1"/>
        <feFuncB type="table" tableValues="0 .10 .22 .36 .50 .64 .78 .90 1"/>
      </feComponentTransfer>
    </filter>
  </defs>
</svg>
